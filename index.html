<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#080D1F; --navy-card:#121A3A; --navy-card-2:#1A2450;
    --gold:#F2B705; --gold-dim:#B8890A; --teal:#2FE0C4; --red:#F2545B;
    --ink:#EDEFFB; --ink-dim:#9AA3C7; --line: rgba(242,183,5,0.18);
    --t1:#F2545B; --t2:#2FE0C4; --t3:#F2B705;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at 50% -10%, #1B2660 0%, var(--navy-deep) 55%), var(--navy-deep);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .display{font-family:'Anton',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px 3px rgba(242,183,5,0.55);}
  .brand h1{font-size:26px;margin:0;text-transform:uppercase;}
  .roomchip{background:var(--navy-card);border:1px solid var(--line);padding:8px 16px;border-radius:999px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-dim);}
  .roomchip b{color:var(--gold);font-family:'JetBrains Mono',monospace;letter-spacing:0.15em;font-size:16px;}
  .card{background:var(--navy-card);border:1px solid var(--line);border-radius:16px;padding:24px;}
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;color:var(--navy-deep); background:var(--gold);}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(242,183,5,0.25);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.teal{background:var(--teal);color:#04211c;}
  .btn.block{width:100%;}
  input[type=text], input[type=number], textarea, select{width:100%;background:var(--navy-deep);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;}
  textarea{resize:vertical;min-height:52px;}
  label{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}
  .hint{color:var(--ink-dim);font-size:13px;line-height:1.5;}
  .center{text-align:center;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .hidden{display:none !important;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;}
  @media(max-width:640px){.home-grid{grid-template-columns:1fr;}}
  .choice-card{background:var(--navy-card);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;cursor:pointer;transition:.15s;}
  .choice-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .choice-card .icon{font-size:40px;margin-bottom:10px;}
  .choice-card h3{margin:6px 0;font-size:20px;}
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px;}
  .cat-head{background:var(--navy-card-2);border:1px solid var(--line);border-radius:8px;padding:12px 8px;text-align:center;font-family:'Anton',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:0.03em;line-height:1.25;min-height:64px;display:flex;align-items:center;justify-content:center;color:var(--gold);min-width:0;overflow-wrap:break-word;}
  .clue-tile{background:linear-gradient(160deg,#16205088,#0d1436);border:1px solid var(--line);border-radius:8px;padding:18px 8px;text-align:center;font-family:'Anton',sans-serif;font-size:22px;color:var(--gold);cursor:pointer;transition:.12s;min-width:0;}
  @media(max-width:640px){
    .wrap{padding:16px 8px 50px;}
    .board{gap:4px;}
    .cat-head{font-size:8.5px;padding:6px 3px;min-height:46px;letter-spacing:0.01em;line-height:1.15;border-radius:6px;}
    .clue-tile{font-size:13px;padding:10px 3px;border-radius:6px;}
  }
  @media(max-width:380px){
    .cat-head{font-size:7.5px;min-height:42px;}
    .clue-tile{font-size:11.5px;padding:8px 2px;}
  }
  .clue-tile:hover{background:#212c66;transform:scale(1.03);}
  .clue-tile.used{color:#3a4270;cursor:default;background:#0b1030;}
  .clue-tile.used:hover{transform:none;}
  .spotlight{position:relative;background:radial-gradient(circle at 50% 0%, #24316f 0%, var(--navy-card) 70%);border:1px solid var(--gold-dim);border-radius:20px;padding:40px 28px;text-align:center;margin-top:18px;}
  .spotlight .cat-label{color:var(--gold);text-transform:uppercase;font-size:13px;letter-spacing:0.15em;font-weight:700;margin-bottom:6px;}
  .spotlight .value{color:var(--ink-dim);font-family:'JetBrains Mono',monospace;margin-bottom:18px;}
  .spotlight .clue-text{font-size:24px;line-height:1.4;font-weight:600;margin-bottom:8px;}
  .spotlight .answer-text{color:var(--teal);font-size:18px;margin-top:14px;font-weight:700;}
  .buzz-btn{width:100%;padding:34px;font-size:24px;border-radius:18px;border:none;font-family:'Anton',sans-serif;letter-spacing:0.04em;cursor:pointer;transition:.08s;color:#fff;}
  .buzz-btn:active{transform:translateY(6px);}
  .buzz-btn.state-blue{background:#2563eb;box-shadow:0 10px 0 #1741a6;}
  .buzz-btn.state-gold{background:var(--gold);color:var(--navy-deep);box-shadow:0 10px 0 var(--gold-dim);}
  .buzz-btn.state-green{background:#22c55e;box-shadow:0 10px 0 #15803d;}
  .buzz-btn.state-yellow{background:#eab308;color:#3a2c00;box-shadow:0 10px 0 #a16207;}
  .buzz-btn.state-red{background:var(--red);box-shadow:0 10px 0 #a3232a;}
  .buzz-btn.state-locked{background:#3a4270;color:#8890b8;box-shadow:0 10px 0 #262d55;cursor:not-allowed;}
  .buzz-btn:disabled{cursor:not-allowed;}
  .legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-dim);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .reading-status{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-weight:700;color:var(--gold);}
  .reading-status .pulse{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulseDot 1s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .scoreboard{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .score-pill{background:var(--navy-card-2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:150px;position:relative;border-left:5px solid var(--tc, var(--gold));}
  .score-pill.control{box-shadow:0 0 0 1px var(--gold);}
  .score-pill .pname{font-size:13px;color:var(--ink-dim);font-weight:600;}
  .score-pill .pscore{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--gold);}
  .score-pill .pscore.neg{color:var(--red);}
  .score-pill .badge{position:absolute;top:-9px;right:8px;background:var(--gold);color:var(--navy-deep);font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;}
  .score-pill .members{font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .cat-editor{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--navy-deep);}
  .clue-editor-row{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:8px;align-items:start;margin-bottom:8px;}
  .clue-editor-row label{margin-bottom:3px;}
  .dd-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);white-space:nowrap;padding-top:24px;}
  .dd-toggle input{width:auto;}
  .status-banner{background:var(--navy-card-2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:16px;font-weight:600;text-align:center;}
  footer.smallnote{margin-top:30px;color:var(--ink-dim);font-size:12.5px;line-height:1.6;text-align:center;}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .players-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .players-list span{background:var(--navy-card-2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;}
  .win-glow{animation:pulseGlow 1.4s infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,0.5);}50%{box-shadow:0 0 0 8px rgba(242,183,5,0);}}
  .team-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
  @media(max-width:560px){.team-pick-grid{grid-template-columns:1fr;}}
  .team-pick{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.12s;background:var(--navy-deep);}
  .team-pick:hover{border-color:var(--gold);}
  .team-pick.full{opacity:0.4;cursor:not-allowed;}
  .team-pick .tname{font-family:'Anton',sans-serif;font-size:16px;margin-bottom:4px;}
  .team-pick .members{font-size:12px;color:var(--ink-dim);}
  .naming-card{border-left:5px solid var(--gold);}
  .vote-btn{display:block;width:100%;text-align:left;background:var(--navy-deep);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;color:var(--ink);cursor:pointer;font-weight:600;}
  .vote-btn:hover{border-color:var(--gold);}
  .browser-note{background:var(--navy-card-2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--ink-dim);margin-bottom:16px;}
  .judge-hint{background:var(--navy-deep);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink-dim);margin-top:10px;}
  .pack-card{background:var(--navy-card);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.15s;text-align:left;}
  .pack-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .pack-card h4{margin:0 0 6px;font-family:'Anton',sans-serif;color:var(--gold);font-size:18px;}
</style>
</head>

// ---------- storage helpers (Firebase Realtime Database — no Claude account needed) ----------
const FIREBASE_DB_URL = 'https://trivia-showdown-63fc6-default-rtdb.firebaseio.com';
function roomPath(code){ return `${FIREBASE_DB_URL}/rooms/${code}.json`; }
async function loadRoom(code){
  try{
    const res = await fetch(roomPath(code));
    if(!res.ok) return null;
    const data = await res.json();
    if(!data) return null;
    return normalizeState(data);
  }catch(e){ console.error('load failed', e); return null; }
}
function normalizeState(data){
  data.players = data.players || {};
  data.activeTeams = data.activeTeams || [];
  data.teamNaming = data.teamNaming || {};
  Object.keys(data.teamNaming).forEach(n=>{
    const t = data.teamNaming[n];
    if(t){
      t.suggestions = t.suggestions || {};
      t.votes = t.votes || {};
      t.candidates = t.candidates || [];
    }
  });
  data.lockedOutTeams = data.lockedOutTeams || [];
  data.earlyLockUntil = data.earlyLockUntil || {};
  data.earlyBuzzers = data.earlyBuzzers || {};
  data.teams = data.teams || {1:{name:null,score:0},2:{name:null,score:0},3:{name:null,score:0}};
  if(data.phase==='daily_double' && data.ddWager===undefined) data.ddWager = {team:0, amount:null};
  else if(data.ddWager) data.ddWager.team = data.ddWager.team || 0;
  if(!data.final) data.final = {stage:'wager', wagers:{}, answers:{}, graded:{}};
  else{
    data.final.wagers = data.final.wagers || {};
    data.final.answers = data.final.answers || {};
    data.final.graded = data.final.graded || {};
    data.final.captains = data.final.captains || {};
    data.final.captainVoting = data.final.captainVoting || {};
    Object.keys(data.final.captainVoting).forEach(n=>{
      const cv = data.final.captainVoting[n];
      if(cv){ cv.candidates = cv.candidates || []; cv.votes = cv.votes || {}; }
    });
    data.final.wagerSuggestions = data.final.wagerSuggestions || {};
    Object.keys(data.final.wagerSuggestions).forEach(n=>{ data.final.wagerSuggestions[n] = data.final.wagerSuggestions[n] || {}; });
    data.final.chat = data.final.chat || {};
    Object.keys(data.final.chat).forEach(n=>{ data.final.chat[n] = data.final.chat[n] || {}; });
  }
  return data;
}

// ---------- text-to-speech (host device only) ----------
let cachedVoice = null;
function getVoicesAsync(){
  return new Promise(resolve=>{
    let voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : [];
    if(voices.length){ resolve(voices); return; }
    if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = ()=> resolve(speechSynthesis.getVoices());
    setTimeout(()=> resolve(('speechSynthesis' in window) ? speechSynthesis.getVoices() : []), 800);
  });
}
async function pickHostVoice(){
  if(cachedVoice) return cachedVoice;
  const voices = await getVoicesAsync();
  const enVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  const pool = enVoices.length ? enVoices : voices;
  const keywords = ['male','david','daniel','alex','fred','george','mark','arthur','aaron','oliver','ryan','guy','tom'];
  const premiumKeywords = ['natural','neural','online','enhanced','premium'];
  let best=null, bestScore=-999;
  pool.forEach(v=>{
    const name=v.name.toLowerCase(); let score=0;
    if(name.includes('female')) score -= 6;
    keywords.forEach(k=>{ if(name.includes(k)) score += 2; });
    premiumKeywords.forEach(k=>{ if(name.includes(k)) score += 4; });
    if(v.lang==='en-US'||v.lang==='en-GB') score += 1;
    if(v.localService===false) score += 1;
    if(score>bestScore){ bestScore=score; best=v; }
  });
  cachedVoice = best || pool[0] || null;
  return cachedVoice;
}
function estimateSpeechMs(introText, bodyText){
  const words = `${introText} ${bodyText}`.trim().split(/\s+/).filter(Boolean).length;
  const msPerWord = 400, pauseBetween = 450, buffer = 700;
  return Math.max(1500, Math.round(words*msPerWord + pauseBetween + buffer));
}
function stopSpeaking(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }
function speakClue(categoryName, value, clueText, onDone){
  if(!('speechSynthesis' in window)){ onDone(); return; }
  window.speechSynthesis.cancel();
  pickHostVoice().then(voice=>{
    const parts = [];
    if(categoryName) parts.push(value ? `${categoryName}, for ${value} dollars.` : categoryName+'.');
    const intro = parts.length ? new SpeechSynthesisUtterance(parts[0]) : null;
    const body = new SpeechSynthesisUtterance(clueText);
    [intro, body].forEach(u=>{ if(!u) return; if(voice) u.voice=voice; u.rate=0.95; u.pitch=1.0; u.volume=1; });
    if(intro){
      intro.onend = ()=> setTimeout(()=> window.speechSynthesis.speak(body), 450);
      intro.onerror = ()=> window.speechSynthesis.speak(body);
    }
    body.onend = ()=> onDone();
    body.onerror = ()=> onDone();
    window.speechSynthesis.speak(intro || body);
  }).catch(()=> onDone());
}

  const totalSteps = Math.round((durationSec*1000)/stepMs);
  const id = setInterval(()=>{
    if(step>=totalSteps){ clearInterval(id); return; }
    try{
      const freq = notes[step % notes.length];
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.05, now+0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+0.8);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now+0.85);
    }catch(e){}
    step++;
  }, stepMs);
}
function buzzerEffectivelyOpen(state){
  return !!state.buzzerOpen;
}

// ---------- board defaults ----------
function blankBoard(round){
  const vals = roundValues(round);
  const cats=[];
  for(let c=0;c<CATS_PER_ROUND;c++){
    const clues=[];
    for(let i=0;i<CLUES_PER_CAT;i++) clues.push(mk(vals[i], '', '', false));
    cats.push({name:'', clues});
  }
  return cats;
}
function activeCats(state){ return state.round===2 ? state.categoriesR2 : state.categoriesR1; }
function freshState(code){
  return {
    code, phase:'lobby', round:1, categoriesR1:draftBoardR1, categoriesR2:draftBoardR2, finalQ:{question:draftFinal.question, answer:draftFinal.answer},
    players:{}, teams:{1:{name:null,score:0},2:{name:null,score:0},3:{name:null,score:0}}, activeTeams:[],
    teamNaming:{}, activeClue:null, readingInProgress:false, buzzerOpen:false, buzzedTeam:null, buzzedPlayer:null,
    lockedOutTeams:[], earlyLockUntil:{}, earlyBuzzers:{}, readEndsAt:null, answerDeadline:null, controllingTeam:null, ddWager:null, ddStage:null, revealAnswer:false,
    final:{stage:'wager',captains:{},captainVoting:{},wagerSuggestions:{},wagers:{},answers:{},chat:{},graded:{}}, updatedAt:Date.now()
  };
}

// ---------- team helpers ----------
function computeMembers(state,n){ return Object.entries(state.players).filter(([,p])=>p.team===n).map(([name])=>name); }
function activeTeamNumbers(state){ const set=new Set(Object.values(state.players).map(p=>p.team)); return [1,2,3].filter(n=>set.has(n)); }
function teamDisplayName(state,n){ return (state.teams[n] && state.teams[n].name) || `Team ${n}`; }
function findExistingPlayerKey(state, name){
  const lower = name.trim().toLowerCase();
  return Object.keys(state.players).find(k => k.toLowerCase() === lower) || null;
}

// ---------- polling ----------
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async ()=>{
    if(!myRoomCode) return;
    const state = await loadRoom(myRoomCode);
    if(state && state.supersededBy && state.supersededBy !== myRoomCode){
      const newCode = state.supersededBy;
      myRoomCode = newCode;
      const newState = await loadRoom(newCode);
      if(newState){ lastStamp = newState.updatedAt; render(newState); }
      return;
    }
    if(state && state.updatedAt !== lastStamp){ lastStamp = state.updatedAt; render(state); }
  }, POLL_MS);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }
async function mutate(fn){
  let state = await loadRoom(myRoomCode);
  if(!state) return;
  fn(state);
  await saveRoom(myRoomCode, state);
  lastStamp = state.updatedAt;
  render(state);
  return state;
}

// ---------- team naming engine ----------
function advanceNaming(s,n){
  const naming = s.teamNaming[n];
  if(!naming) return;
  if(naming.stage==='suggest'){
    const distinct = [...new Set(Object.values(naming.suggestions).filter(x=>x&&x.trim()).map(x=>x.trim()))];
    if(distinct.length===0) finalizeTeamName(s,n,randomAnimalName(),false,true);
    else if(distinct.length===1) finalizeTeamName(s,n,distinct[0]);
    else { naming.candidates=distinct; naming.votes={}; naming.stage='vote'; }
  } else if(naming.stage==='vote' || naming.stage==='tiebreak'){
    const tally={}; naming.candidates.forEach(c=>tally[c]=0);
    Object.values(naming.votes).forEach(v=>{ if(tally[v]!==undefined) tally[v]++; });
    const max=Math.max(...Object.values(tally));
    const winners=Object.keys(tally).filter(c=>tally[c]===max);
    if(winners.length===1) finalizeTeamName(s,n,winners[0]);
    else if(naming.stage==='vote'){ naming.candidates=winners; naming.votes={}; naming.stage='tiebreak'; }
    else { const pick=winners[Math.floor(Math.random()*winners.length)]; finalizeTeamName(s,n,pick,true); }
  }
  checkAllNamingDone(s);
}
function finalizeTeamName(s,n,name,coinFlip,autoAnimal){
  s.teams[n].name=name; s.teamNaming[n].stage='done'; s.teamNaming[n].coinFlip=!!coinFlip; s.teamNaming[n].autoAnimal=!!autoAnimal;
}
function checkAllNamingDone(s){
  const allDone = s.activeTeams.every(n => !s.teamNaming[n] || s.teamNaming[n].stage==='done');
  if(allDone) s.phase='board';
}

// ---------- Final Jeopardy: captain selection engine ----------
function initFinalRound(s){
  const captains = {}, captainVoting = {};
  s.activeTeams.forEach(n=>{
    const members = computeMembers(s,n);
    if(members.length<=1) captains[n] = members[0];
    else captainVoting[n] = {stage:'vote', candidates:[...members], votes:{}};
  });
  const needsSelection = Object.keys(captainVoting).length > 0;
  s.final = {
    stage: needsSelection ? 'select_captain' : 'wager',
    captains, captainVoting,
    wagerSuggestions:{}, wagers:{}, answers:{}, chat:{}, graded:{}, answerDeadline:null
  };
}
function advanceCaptainVoting(s, n){
  const cv = s.final.captainVoting[n];
  if(!cv) return;
  const tally={}; cv.candidates.forEach(c=>tally[c]=0);
  Object.values(cv.votes).forEach(v=>{ if(tally[v]!==undefined) tally[v]++; });
  const max=Math.max(...Object.values(tally));
  const winners=Object.keys(tally).filter(c=>tally[c]===max);
  if(winners.length===1){ s.final.captains[n]=winners[0]; cv.stage='done'; }
  else if(cv.stage==='vote'){ cv.candidates=winners; cv.votes={}; cv.stage='tiebreak'; }
  else { const pick=winners[Math.floor(Math.random()*winners.length)]; s.final.captains[n]=pick; cv.stage='done'; }
  checkAllCaptainsSelected(s);
}
function checkAllCaptainsSelected(s){
  const allDone = s.activeTeams.every(n => s.final.captains[n] !== undefined);
  if(allDone) s.final.stage = 'wager';
}

    <div class="cat-editor">

          <div class="field" style="margin-bottom:0;"><label>Clue</label><input type="text" data-cat="${ci}" data-idx="${li}" class="clueText" value="${escapeAttr(cl.text)}" placeholder="Clue text"></div>

        </div>
      `).join('')}

  `).join('');
  catWrap.querySelectorAll('.catName').forEach(el=> el.oninput = ()=> draft[el.dataset.cat].name = el.value);

  catWrap.querySelectorAll('.ddBox').forEach(el=> el.onchange = ()=> draft[el.dataset.cat].clues[el.dataset.idx].dailyDouble = el.checked);

  function boardIncomplete(){
    return draftBoardR1.some(c=>!c.name.trim() || c.clues.some(cl=>!cl.text.trim()||!cl.answer.trim()))

    let code=genCode(); let existing=await loadRoom(code); let tries=0;
    while(existing && tries<5){ code=genCode(); existing=await loadRoom(code); tries++; }

    alert('Saved! You will see it next time you choose a board.');
  };
}

let lastSpokenDD = null;

function renderHostDailyDouble(state){
  const clue = activeCats(state)[state.activeClue.c].clues[state.activeClue.i];

  if(state.ddStage==='reveal' && lastSpokenDD !== ddKey){
    lastSpokenDD = ddKey;
    speakClue('', '', clue.text, ()=>{
      mutate(s=>{
        if(s.activeClue && s.activeClue.c===state.activeClue.c && s.activeClue.i===state.activeClue.i && s.ddStage==='reveal'){
          s.answerDeadline = Date.now()+5000;
        }
      });
    });
  }
  const secsLeft = state.ddStage==='reveal' && state.answerDeadline ? Math.max(0, Math.ceil((state.answerDeadline-Date.now())/1000)) : null;
  const isTrueDD = state.ddWager.trueDD;

  app.innerHTML = `
    ${topbarRoom(state,'Host')}
    <div class="spotlight">
      <div class="cat-label" style="color:var(--red);">⭐ DAILY DOUBLE${isTrueDD?' — TRUE DAILY DOUBLE! 🌟':''} ⭐</div>

      ${state.ddStage==='wager' ? `

        <div class="answer-text">Correct response: ${escapeHtml(clue.answer)}${state.revealAnswer ? ' (shown to players)' : ' — private, for your eyes only'}</div>
      `}
    </div>
    ${state.ddStage==='reveal' ? `<div class="row" style="margin-top:16px;">
        <button class="btn teal" id="ddCorrect">✔ Correct</button>
        <button class="btn danger" id="ddWrong">✘ Wrong</button>
        <button class="btn secondary" id="ddReveal">📣 Reveal to Players</button></div>

    <div class="center" style="margin-top:14px;"><button class="btn secondary" id="backBoard">Back to Board</button></div>

  const setW = document.getElementById('setWagerer');

  const ddCorrect = document.getElementById('ddCorrect');
  if(ddCorrect) ddCorrect.onclick = ()=> mutate(s=>{ s.teams[s.ddWager.team].score += s.ddWager.amount; s.controllingTeam=s.ddWager.team; finishDD(s); });
  const ddWrong = document.getElementById('ddWrong');
  if(ddWrong) ddWrong.onclick = ()=> mutate(s=>{ s.teams[s.ddWager.team].score -= s.ddWager.amount; finishDD(s); });

  if(ddReveal) ddReveal.onclick = ()=> mutate(s=>{ s.revealAnswer=true; });

  function finishDD(s){ const cl=activeCats(s)[s.activeClue.c].clues[s.activeClue.i]; cl.answered=true; s.phase='board'; s.activeClue=null; s.ddWager=null; s.ddStage=null; s.revealAnswer=false; s.answerDeadline=null; }

function computeBuzzState(state, myTeam, myName){
  const now = Date.now();
  const effOpen = buzzerEffectivelyOpen(state);
  const isSteal = state.lockedOutTeams.length > 0;
  const jumpedEarly = !!(state.earlyBuzzers && state.earlyBuzzers[myName]);
  const earlyUntil = state.earlyLockUntil && state.earlyLockUntil[myName];
  const stillServingPenalty = earlyUntil && now < earlyUntil;
  if(jumpedEarly && (!effOpen || stillServingPenalty)){
    return {
      cls:'state-red',
      label: effOpen ? 'TOO EARLY — 0.5s DELAY' : 'TOO EARLY!',
      disabled:true,
      sub: effOpen ? 'Serving your penalty for jumping the gun — one moment…' : "You jumped before the reading finished — you'll serve a 0.5s delay the instant the buzzer opens. Your teammates can still buzz."
    };
  }
  if(state.lockedOutTeams.includes(myTeam)) return {cls:'state-locked', label: !effOpen ? 'LISTEN…' : 'LOCKED OUT', disabled:true, sub:''};
  if(state.buzzedTeam){
    if(state.buzzedTeam === myTeam){
      if(state.buzzedPlayer === myName) return {cls:'state-green', label:"YOU'RE UP — ANSWER NOW!", disabled:true, sub:'Speak your answer out loud.'};
      return {cls:'state-locked', label:`${state.buzzedPlayer} IS ANSWERING`, disabled:true, sub:'Your teammate has the floor.'};
    }
    return {cls:'state-locked', label:`${teamDisplayName(state,state.buzzedTeam).toUpperCase()} BUZZED IN`, disabled:true, sub:''};
  }
  if(!effOpen) return {cls:'state-blue', label:"WAIT — DON'T BUZZ YET", disabled:false, sub:'Buzzing now adds a short penalty for your team.'};
  return isSteal ? {cls:'state-yellow', label:'STEAL — BUZZ IN!', disabled:false, sub:'Your team can steal the points.'} : {cls:'state-gold', label:'BUZZ IN', disabled:false, sub:''};
}

function renderPlayerClue(state){

  const myTeam = state.players[myName].team;

  const secsLeft = state.buzzedTeam===myTeam && state.buzzedPlayer===myName && state.answerDeadline ? Math.max(0, Math.ceil((state.answerDeadline-Date.now())/1000)) : null;
  app.innerHTML = `
    ${topbarRoom(state,myName)}

    </div>
    <button class="buzz-btn ${bs.cls}" id="buzzBtn" style="margin-top:18px;" ${bs.disabled?'disabled':''}>${bs.label}${secsLeft!==null?` (${secsLeft}s)`:''}</button>
    ${bs.sub ? `<div class="hint center" style="margin-top:8px;">${bs.sub}</div>` : ''}
    <div class="legend">
      <span><i style="background:#2563eb;"></i> Wait</span>
      <span><i style="background:var(--gold);"></i> Ready</span>
      <span><i style="background:#22c55e;"></i> You're up</span>
      <span><i style="background:#eab308;"></i> Steal</span>
      <span><i style="background:var(--red);"></i> Too early</span>
      <span><i style="background:#3a4270;"></i> Locked</span>
    </div>
    ${teamScoreboardHtml(state)}
  `;

    btn.onclick = async ()=>{

      localBuzzLock = true;
      await mutate(s=>{
        const team = s.players[myName].team;
        if(s.lockedOutTeams.includes(team)) return;
        const eu = s.earlyLockUntil && s.earlyLockUntil[myName];
        if(eu && Date.now() < eu) return;
        if(!buzzerEffectivelyOpen(s)){
          s.earlyLockUntil = s.earlyLockUntil || {};

          s.earlyBuzzers = s.earlyBuzzers || {};
          s.earlyBuzzers[myName] = true;
          s.earlyBuzzBy = myName;
          return;
        }
        if(!s.buzzedTeam){ s.buzzedTeam = team; s.buzzedPlayer = myName; s.answerDeadline = Date.now()+5000; if(!s.buzzerOpen) s.buzzerOpen = true; }
      });
      localBuzzLock = false;
    };
  }
}

  const sa = document.getElementById('submitFAnswer');
  if(sa) sa.onclick = ()=>{ const ans=document.getElementById('fAnswer').value.trim(); if(!ans) return; submitAnswer(ans); };
  const sendChatBtn = document.getElementById('sendChatBtn');
  if(sendChatBtn) sendChatBtn.onclick = ()=>{
    const inp = document.getElementById('chatInput');
    const text = inp.value.trim();
    if(!text) return;
    inp.value = '';
    const msgId = Date.now()+'_'+Math.random().toString(36).slice(2,6);
    patchPath(`final/chat/${myTeam}`, {[msgId]: {name:myName, text, ts:Date.now()}}).then(()=> mutate(()=>{}));
  };
  if(f.stage==='answer' && !answered && state.final.answerDeadline){
    const deadline = state.final.answerDeadline;
    const cdEl = document.getElementById('finalCountdown');
    const tick = ()=>{
      const secs = Math.max(0, Math.ceil((deadline-Date.now())/1000));
      if(cdEl) cdEl.textContent = `⏳ ${secs}s remaining`;
      if(secs<=0){
        clearInterval(finalCountdownTimer); finalCountdownTimer=null;
        if(isCaptain){
          const inputEl = document.getElementById('fAnswer');
          const val = inputEl ? inputEl.value.trim() : '';
          submitAnswer(val || '(no answer — time expired)');
        }
      }
    };
    tick();
    finalCountdownTimer = setInterval(tick, 250);
  }
}

// =================================================================
// TV DISPLAY VIEWS (public-safe — never shows the correct response)
// =================================================================
function renderDisplayWaiting(state){
  app.innerHTML = `
    ${topbarRoom(state,'Display')}
    <div class="card center"><div class="display" style="font-size:40px;color:var(--gold);">${state.code}</div>
      <div class="hint" style="margin-top:8px;">Waiting for the game to start…</div></div>
  `;
}
function renderDisplayBoard(state){
  const cats = activeCats(state);
  const vals = roundValues(state.round);
  app.innerHTML = `
    ${topbarRoom(state, state.round===1?'Display · Round 1':'Display · Double Jeopardy')}
    <div class="card">
      <div class="board">
        ${cats.map(c=>`<div class="cat-head">${escapeHtml(c.name)}</div>`).join('')}
        ${vals.map((v,li)=>cats.map((c)=>{ const cl=c.clues[li]; return `<div class="clue-tile used" style="cursor:default;">${cl.answered?'':fmt(cl.value)}</div>`; }).join('')).join('')}
      </div>
      ${teamScoreboardHtml(state)}
    </div>
  `;
}
function renderDisplayClue(state){
  const clue = activeCats(state)[state.activeClue.c].clues[state.activeClue.i];
  const cat = activeCats(state)[state.activeClue.c];
  const isSteal = state.lockedOutTeams.length > 0;
  const secsLeft = state.buzzedTeam && state.answerDeadline ? Math.max(0, Math.ceil((state.answerDeadline-Date.now())/1000)) : null;
  const noTeamsLeft = state.activeTeams.length>0 && state.activeTeams.every(n=>state.lockedOutTeams.includes(n));
  app.innerHTML = `
    ${topbarRoom(state,'Display')}
    <div class="spotlight">
      <div class="cat-label">${escapeHtml(cat.name)}</div>
      <div class="value">${fmt(clue.value)}</div>
      <div class="clue-text">${escapeHtml(clue.text)}</div>
    </div>
    <div class="reading-status">
      ${state.readingInProgress ? `<div class="pulse"></div> Reading clue aloud — buzzers are locked…`
        : (state.buzzedTeam ? `🟢 ${escapeHtml(state.buzzedPlayer)} from ${escapeHtml(teamDisplayName(state,state.buzzedTeam))} buzzed in first!${secsLeft!==null?(secsLeft>0?` (${secsLeft}s to answer)`:` — judging…`):''}`
        : (state.buzzerOpen ? (isSteal ? '🟡 Steal window open — remaining teams may ring in' : '🟢 Buzzers open — waiting for a team to ring in…')
        : (noTeamsLeft ? '⚪ Moving on to the next clue…' : 'Buzzers closed')))}
    </div>
    ${teamScoreboardHtml(state)}
  `;
}
function renderDisplayDailyDouble(state){
  const cat = activeCats(state)[state.activeClue.c];
  const wagerTeam = state.ddWager.team;
  app.innerHTML = `
    ${topbarRoom(state,'Display')}
    <div class="spotlight">
      <div class="cat-label" style="color:var(--red);">⭐ DAILY DOUBLE ⭐</div>
      <div class="value">${escapeHtml(cat.name)}</div>
      <div class="hint" style="margin-top:14px;">${wagerTeam ? `${escapeHtml(teamDisplayName(state,wagerTeam))} ${state.ddStage==='wager' ? 'is wagering…' : `wagered ${fmt(state.ddWager.amount)}${state.ddWager.trueDD?' — True Daily Double! 🌟':''}`}` : 'Choosing who wagers…'}</div>
    </div>
    ${teamScoreboardHtml(state)}
  `;
}
function renderDisplayFinal(state){
  const f = state.final; const actives = state.activeTeams;
  const secsLeft = f.stage==='answer' && f.answerDeadline ? Math.max(0, Math.ceil((f.answerDeadline-Date.now())/1000)) : null;
  app.innerHTML = `
    ${topbarRoom(state,'Display · Final Round')}
    <div class="card">
      ${f.stage==='select_captain' ? `<div class="hint center">Teams are selecting their Final Jeopardy captains…</div>` : `
        <div class="spotlight" style="margin-top:0;">
          <div class="clue-text">${f.stage!=='wager' ? escapeHtml(state.finalQ.question) : '🔒 Final clue — hidden until every captain locks in a wager'}</div>
          ${f.stage==='reading' ? `<div class="reading-status"><div class="pulse"></div> Reading clue aloud…</div>` : ''}
          ${f.stage==='answer' && secsLeft!==null ? `<div class="reading-status" style="color:var(--teal);">⏱ ${secsLeft}s remaining</div>` : ''}
        </div>
        <div class="hint center" style="margin-top:14px;">
          ${f.stage==='wager' ? `Captains locked in: ${actives.filter(n=>f.wagers[n]!==undefined).length}/${actives.length}` : ''}
          ${f.stage==='answer' ? `Captains answered: ${actives.filter(n=>f.answers[n]!==undefined).length}/${actives.length}` : ''}
        </div>
        ${f.stage==='grading' ? `<div class="stack" style="margin-top:10px;">
          ${actives.map(n=>`<div class="kv" style="align-items:center;border-left:5px solid ${TEAM_COLORS[n]};padding:10px 14px;border-radius:10px;">
            <div><b>${escapeHtml(teamDisplayName(state,n))}</b> wagered ${fmt(f.wagers[n]||0)}${f.graded[n]!==undefined ? `<br><span class="hint">"${escapeHtml(f.answers[n]||'(no answer)')}"</span>` : ''}</div>
            <div>${f.graded[n]===undefined ? `<span class="hint">judging…</span>` : `<span style="color:${f.graded[n]?'var(--teal)':'var(--red)'};font-weight:700;">${f.graded[n]?'✔ Correct':'✘ Wrong'}</span>`}</div>
          </div>`).join('')}
        </div>` : ''}
      `}
      ${teamScoreboardHtml(state)}
    </div>
  `;
}

function renderPlayerRemoved(){
  stopPolling();
  app.innerHTML = `
    <div class="topbar"><div class="brand"><div class="dot"></div><h1 class="display">Trivia Showdown</h1></div></div>
    <div class="card center">
      <div class="display" style="font-size:22px;color:var(--red);margin-bottom:10px;">You've been removed from this game</div>
      <div class="hint">The host removed you from the room before it started. If this was a mistake, ask them for the room code and rejoin.</div>
      <div class="hint" style="margin-top:10px;">Returning to the home screen…</div>
      <button class="btn" id="backHomeRemoved" style="margin-top:16px;">Go Home Now</button>
    </div>
  `;
  document.getElementById('backHomeRemoved').onclick = ()=> location.reload();
  setTimeout(()=> location.reload(), 2000);
}

function renderHostSuperseded(state){
  app.innerHTML = `
    ${topbarRoom(state,'Host — Taken Over')}
    <div class="card center">
      <div class="display" style="font-size:24px;color:var(--red);margin-bottom:10px;">⚠️ Another device has taken over hosting this room</div>
      <div class="hint">This screen is now read-only to avoid two hosts issuing conflicting commands. The game itself is unaffected.</div>
      <button class="btn" id="reclaimHost" style="margin-top:18px;">Take Back Control</button>
      <button class="btn secondary" id="goHomeFromSuperseded" style="margin-top:10px;">Go Home</button>
    </div>
  `;
  document.getElementById('reclaimHost').onclick = async ()=>{
    if(!confirm('This will disconnect the other device\'s host controls. Continue?')) return;
    myHostToken = genHostToken();
    await mutate(s=>{ s.hostToken = myHostToken; });
  };
  document.getElementById('goHomeFromSuperseded').onclick = ()=>{ stopPolling(); stopSpeaking(); myRole=null; myRoomCode=null; myHostToken=null; renderHome(); };
}
function render(state){
  if(!state) return;
  currentState = state;
  if(myRole==='host'){
    if(myHostToken && state.hostToken && state.hostToken !== myHostToken) return renderHostSuperseded(state);
    if(state.phase==='lobby') return renderHostLobby(state);
    if(state.phase==='team_naming') return renderHostTeamNaming(state);
    if(state.phase==='board') return renderHostBoard(state);
    if(state.phase==='clue') return renderHostClue(state);
    if(state.phase==='daily_double') return renderHostDailyDouble(state);
    if(state.phase==='final') return renderHostFinal(state);
    if(state.phase==='end') return renderEnd(state, true);
  } else if(myRole==='player'){
    if(!state.players[myName]) return renderPlayerRemoved();
    if(state.phase==='lobby') return renderPlayerLobby(state);
    if(state.phase==='team_naming') return renderPlayerTeamNaming(state);
    if(state.phase==='board') return renderPlayerBoard(state);
    if(state.phase==='clue') return renderPlayerClue(state);
    if(state.phase==='daily_double') return renderPlayerDailyDouble(state);
    if(state.phase==='final') return renderPlayerFinal(state);
    if(state.phase==='end') return renderEnd(state, false);
  } else if(myRole==='display'){
    if(state.phase==='lobby' || state.phase==='team_naming') return renderDisplayWaiting(state);
    if(state.phase==='board') return renderDisplayBoard(state);
    if(state.phase==='clue') return renderDisplayClue(state);
    if(state.phase==='daily_double') return renderDisplayDailyDouble(state);
    if(state.phase==='final') return renderDisplayFinal(state);
    if(state.phase==='end') return renderEnd(state, false);
  }
}

setInterval(()=>{
  if(!currentState) return;
  const p = currentState.phase;
  const shouldTick = (p==='clue') || (p==='daily_double' && currentState.ddStage==='reveal');
  if(shouldTick) render(currentState);
}, 200);

(function boot(){
  const params = new URLSearchParams(location.search);
  const dCode = params.get('display');
  if(dCode){
    loadRoom(dCode.toUpperCase()).then(state=>{
      if(state){ myRole='display'; myRoomCode=dCode.toUpperCase(); startPolling(); render(state); }
      else renderDisplayJoin();
    });
  } else {
    renderHome();
  }
})();
</script>
